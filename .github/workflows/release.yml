name: Release public offline bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Build public bundle
        run: >-
          codegraph-harness bundle --version 0.2.0-rc.1-release-gate
          --profile packaging/profiles/public.json
          --output dist/codegraph-harness-0.2.0-rc.1-release-gate.zip

  plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.239
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict ./plugins/codegraph-evaluator
          claude plugin validate --strict .
      - name: Ensure no distributable MCP is enabled
        shell: bash
        run: |
          test ! -e plugins/codegraph-evaluator/.mcp.json
          test ! -e plugins/codegraph-evaluator/mcp.json

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check formatting
        run: black --check src tests clients
      - name: Check types
        run: mypy --strict src clients

  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.mod
      - name: Test, vet, and race-check gateway
        working-directory: gateway
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Cross-build supported gateway targets
        working-directory: gateway
        run: |
          mkdir -p "${RUNNER_TEMP}/codegraph-gateway"
          GOOS=darwin GOARCH=amd64 go build -trimpath -o "${RUNNER_TEMP}/codegraph-gateway/darwin-amd64" ./cmd/codegraph-gateway
          GOOS=darwin GOARCH=arm64 go build -trimpath -o "${RUNNER_TEMP}/codegraph-gateway/darwin-arm64" ./cmd/codegraph-gateway
          GOOS=windows GOARCH=amd64 go build -trimpath -o "${RUNNER_TEMP}/codegraph-gateway/windows-amd64.exe" ./cmd/codegraph-gateway
          GOOS=windows GOARCH=arm64 go build -trimpath -o "${RUNNER_TEMP}/codegraph-gateway/windows-arm64.exe" ./cmd/codegraph-gateway

  windows-process-tree:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.mod
      - name: Prove Windows Job Object terminates backend descendants
        working-directory: gateway
        run: |
          go test ./internal/gateway -run TestCBMCloseTerminatesTheCompleteProcessTreeAndIsIdempotent -count=1 -v
          go test ./cmd/codegraph-gateway -run TestIndexLockIsExclusiveAndAutomaticallyRecoverable -count=1 -v

  shell-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n installers/macos/install.sh installers/macos/uninstall.sh
      - name: Run ShellCheck
        run: shellcheck installers/macos/install.sh installers/macos/uninstall.sh

  bundle:
    needs: [test, plugin-validation, python-quality, go-quality, windows-process-tree, shell-safety]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deterministic bundle
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          PYTHONPATH=src python3 -m codegraph_harness.bundle --version "$version" --profile packaging/profiles/public.json --output "dist/codegraph-harness-${version}.zip"
          sha256sum "dist/codegraph-harness-${version}.zip" > "dist/codegraph-harness-${version}.zip.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          asset="dist/codegraph-harness-${version}.zip"
          gh release create "$TAG_NAME" "$asset" "${asset}.sha256" --generate-notes --verify-tag --prerelease
