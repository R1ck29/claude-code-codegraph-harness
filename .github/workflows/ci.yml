name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Build public bundle
        run: codegraph-harness bundle --version 0.1.0-ci --profile packaging/profiles/public.json --output dist/codegraph-harness-0.1.0-ci.zip

  plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.239
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict ./plugins/codegraph-evaluator
          claude plugin validate --strict .
      - name: Ensure no distributable MCP is enabled
        shell: bash
        run: |
          test ! -e plugins/codegraph-evaluator/.mcp.json
          test ! -e plugins/codegraph-evaluator/mcp.json

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check formatting
        run: black --check src tests
      - name: Check types
        run: mypy --strict src

  shell-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n installers/macos/install.sh installers/macos/uninstall.sh
      - name: Run ShellCheck
        run: shellcheck installers/macos/install.sh installers/macos/uninstall.sh
